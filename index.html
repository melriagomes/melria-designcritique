<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Critique Chat</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #e2e4e9;
    --text: #1c1e21;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-ink: #ffffff;
    --agent-bubble: #ffffff;
    --user-bubble: #2563eb;
    --error-bg: #fdecea;
    --error-border: #f5b5ac;
    --error-text: #7a271a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 760px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; }
  header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  #settingsBtn {
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
    font-size: 20px;
    color: var(--muted);
    border-radius: 6px;
    flex-shrink: 0;
  }
  #settingsBtn:hover { background: var(--bg); color: var(--text); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg { display: flex; flex-direction: column; max-width: 82%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.agent { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
    word-wrap: break-word;
  }
  .msg.user .bubble { background: var(--user-bubble); color: var(--accent-ink); border-radius: 14px 14px 4px 14px; }
  .msg.agent .bubble { background: var(--agent-bubble); border: 1px solid var(--border); border-radius: 14px 14px 14px 4px; }
  .msg.error .bubble { background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text); }

  .msg .thumb {
    max-width: 220px;
    max-height: 220px;
    border-radius: 10px;
    margin-bottom: 6px;
    display: block;
  }
  .msg .note { margin-top: 4px; font-size: 13px; opacity: 0.9; }
  .msg .annotated {
    display: block;
    max-width: 100%;
    border-radius: 10px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
  }
  .msg .url-chip {
    font-size: 13px;
    text-decoration: underline;
    word-break: break-all;
  }

  .bubble h2 { font-size: 15px; margin: 0 0 6px; }
  .bubble h3 { font-size: 13.5px; margin: 12px 0 4px; color: var(--accent); }
  .bubble p { margin: 0 0 8px; }
  .bubble ul, .bubble ol { margin: 0 0 8px; padding-left: 20px; }
  .bubble li { margin-bottom: 4px; }

  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  #composer {
    border-top: 1px solid var(--border);
    padding: 12px 16px 16px;
  }

  .mode-toggle {
    display: inline-flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 10px;
  }
  .mode-toggle button {
    border: none;
    background: transparent;
    padding: 6px 14px;
    font-size: 13px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--muted);
  }
  .mode-toggle button.active {
    background: var(--panel);
    color: var(--text);
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    font-weight: 600;
  }

  .mode-panel { display: none; }
  .mode-panel.active { display: block; }

  .attach-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .attach-btn {
    border: 1px dashed var(--border);
    background: var(--bg);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
  }
  .file-preview {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
  }
  .file-preview img { width: 32px; height: 32px; object-fit: cover; border-radius: 6px; }
  .file-preview button {
    border: none; background: none; color: var(--muted); cursor: pointer; font-size: 13px; text-decoration: underline;
  }

  #urlInput, #audienceInput, #goalsInput, #noteInput {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 8px;
    resize: none;
  }
  #noteInput { min-height: 38px; }

  .send-row { display: flex; justify-content: flex-end; }
  #sendBtn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #sendBtn:disabled { opacity: 0.45; cursor: not-allowed; }

  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Design Critique Agent</h1>
      <p>Send an image or a URL — get back a structured critique with concrete fixes.</p>
    </div>
    <button id="settingsBtn" type="button" title="Settings" aria-label="Settings">⚙️</button>
  </header>

  <div id="messages"></div>

  <div id="composer">
    <div class="mode-toggle">
      <button id="tabImage" class="active" type="button">🖼️ Image</button>
      <button id="tabUrl" type="button">🔗 URL</button>
    </div>

    <div id="panelImage" class="mode-panel active">
      <div class="attach-row">
        <button class="attach-btn" id="attachBtn" type="button">📎 Choose image…</button>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
        <div class="file-preview" id="filePreview">
          <img id="previewThumb" alt="">
          <span id="previewName"></span>
          <button id="removeFile" type="button">remove</button>
        </div>
      </div>
    </div>

    <div id="panelUrl" class="mode-panel">
      <input type="text" id="urlInput" placeholder="https://example.com/screen-to-critique or a figma.com file/design link">
    </div>

    <input type="text" id="audienceInput" placeholder="Intended audience (optional, e.g. “new users on mobile”)">
    <input type="text" id="goalsInput" placeholder="Design goal (optional, e.g. “increase signups”)">
    <textarea id="noteInput" placeholder="Optional note (e.g. “focus on the checkout flow”)"></textarea>

    <div class="send-row">
      <button id="sendBtn" disabled>Send</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const tabImage = document.getElementById('tabImage');
const tabUrl = document.getElementById('tabUrl');
const panelImage = document.getElementById('panelImage');
const panelUrl = document.getElementById('panelUrl');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');
const filePreview = document.getElementById('filePreview');
const previewThumb = document.getElementById('previewThumb');
const previewName = document.getElementById('previewName');
const removeFile = document.getElementById('removeFile');
const urlInput = document.getElementById('urlInput');
const audienceInput = document.getElementById('audienceInput');
const goalsInput = document.getElementById('goalsInput');
const noteInput = document.getElementById('noteInput');
const sendBtn = document.getElementById('sendBtn');
const hint = document.getElementById('hint');
const settingsBtn = document.getElementById('settingsBtn');

const API_KEYS_STORAGE = 'designCritiqueApiKeys';
const ACTIVE_KEY_ID_STORAGE = 'designCritiqueActiveApiKeyId';

settingsBtn.addEventListener('click', () => {
  window.location.href = '/settings';
});

// Returns the value of whichever saved key is marked active in Settings, or
// null if none is set — matches the list settings.html manages.
function getActiveApiKeyValue() {
  try {
    const keys = JSON.parse(localStorage.getItem(API_KEYS_STORAGE) || '[]');
    const activeId = localStorage.getItem(ACTIVE_KEY_ID_STORAGE);
    const active = keys.find((k) => k.id === activeId);
    return active ? active.value : null;
  } catch (err) {
    return null;
  }
}

let mode = 'image';
let selectedFile = null;
let busy = false;

function setMode(next) {
  mode = next;
  tabImage.classList.toggle('active', mode === 'image');
  tabUrl.classList.toggle('active', mode === 'url');
  panelImage.classList.toggle('active', mode === 'image');
  panelUrl.classList.toggle('active', mode === 'url');
  updateSendState();
}
tabImage.addEventListener('click', () => setMode('image'));
tabUrl.addEventListener('click', () => setMode('url'));

attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  selectedFile = file;
  previewName.textContent = file.name;
  previewThumb.src = URL.createObjectURL(file);
  filePreview.style.display = 'flex';
  updateSendState();
});
removeFile.addEventListener('click', () => {
  selectedFile = null;
  fileInput.value = '';
  filePreview.style.display = 'none';
  updateSendState();
});
urlInput.addEventListener('input', updateSendState);

function updateSendState() {
  const ready = busy ? false : (mode === 'image' ? !!selectedFile : urlInput.value.trim().length > 0);
  sendBtn.disabled = !ready;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function inline(s) {
  return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

// Minimal Markdown -> HTML for the fixed critique structure (##, ###, -, 1., blank-line paragraphs).
function renderMarkdown(md) {
  const lines = md.split('\n');
  let html = '';
  let listType = null; // 'ul' | 'ol' | null
  let paragraph = [];

  function flushParagraph() {
    if (paragraph.length) {
      html += `<p>${paragraph.join(' ')}</p>`;
      paragraph = [];
    }
  }
  function closeList() {
    if (listType) { html += `</${listType}>`; listType = null; }
  }

  for (const raw of lines) {
    const line = raw.trim();
    if (line === '') { flushParagraph(); closeList(); continue; }

    if (line.startsWith('### ')) {
      flushParagraph(); closeList();
      html += `<h3>${inline(line.slice(4))}</h3>`;
    } else if (line.startsWith('## ')) {
      flushParagraph(); closeList();
      html += `<h2>${inline(line.slice(3))}</h2>`;
    } else if (/^[-*]\s+/.test(line)) {
      flushParagraph();
      if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
      html += `<li>${inline(line.replace(/^[-*]\s+/, ''))}</li>`;
    } else if (/^\d+\.\s+/.test(line)) {
      flushParagraph();
      if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
      html += `<li>${inline(line.replace(/^\d+\.\s+/, ''))}</li>`;
    } else {
      closeList();
      paragraph.push(inline(line));
    }
  }
  flushParagraph();
  closeList();
  return html;
}

function addUserMessage({ file, url, note, audience, goals }) {
  const wrap = document.createElement('div');
  wrap.className = 'msg user';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (file) {
    const img = document.createElement('img');
    img.className = 'thumb';
    img.src = URL.createObjectURL(file);
    bubble.appendChild(img);
  } else if (url) {
    const chip = document.createElement('div');
    chip.className = 'url-chip';
    chip.textContent = url;
    bubble.appendChild(chip);
  }
  const extraLines = [];
  if (audience) extraLines.push(`Audience: ${audience}`);
  if (goals) extraLines.push(`Goal: ${goals}`);
  if (note) extraLines.push(note);
  if (extraLines.length) {
    const noteEl = document.createElement('div');
    noteEl.className = 'note';
    noteEl.textContent = extraLines.join(' · ');
    bubble.appendChild(noteEl);
  }
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  scrollToBottom();
}

function addTypingBubble() {
  const wrap = document.createElement('div');
  wrap.className = 'msg agent';
  wrap.id = 'typingBubble';
  wrap.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(wrap);
  scrollToBottom();
  return wrap;
}

function replaceTyping(html, isError, annotatedImageDataUrl) {
  const typing = document.getElementById('typingBubble');
  if (!typing) return;
  typing.className = isError ? 'msg error' : 'msg agent';
  typing.id = '';
  const imgHtml = annotatedImageDataUrl
    ? `<img class="annotated" src="${annotatedImageDataUrl}" alt="Annotated design with numbered callouts">`
    : '';
  typing.querySelector('.bubble').innerHTML = imgHtml + html;
  scrollToBottom();
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setBusy(next) {
  busy = next;
  sendBtn.textContent = busy ? 'Critiquing…' : 'Send';
  updateSendState();
}

sendBtn.addEventListener('click', async () => {
  if (busy) return;
  const note = noteInput.value.trim();
  const audience = audienceInput.value.trim();
  const goals = goalsInput.value.trim();
  const formData = new FormData();

  if (mode === 'image') {
    if (!selectedFile) return;
    formData.append('image', selectedFile);
    addUserMessage({ file: selectedFile, note, audience, goals });
  } else {
    const url = urlInput.value.trim();
    if (!url) return;
    formData.append('url', url);
    addUserMessage({ url, note, audience, goals });
  }
  if (note) formData.append('note', note);
  if (audience) formData.append('audience', audience);
  if (goals) formData.append('goals', goals);

  // Attach whichever key this visitor marked active in Settings, if any —
  // used to authenticate the URL fetch (Figma token for figma.com links,
  // bearer token for anything else). Falls back to the server's shared
  // Figma token when absent, and to no auth for other URLs — same as before
  // for anyone who hasn't saved a key.
  const activeKey = getActiveApiKeyValue();
  if (activeKey) formData.append('access_token', activeKey);

  // Reset composer for the next turn.
  const usedFile = selectedFile;
  selectedFile = null;
  fileInput.value = '';
  filePreview.style.display = 'none';
  urlInput.value = '';
  audienceInput.value = '';
  goalsInput.value = '';
  noteInput.value = '';
  hint.textContent = '';

  setBusy(true);
  addTypingBubble();

  try {
    const res = await fetch('/api/critique', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) {
      replaceTyping(escapeHtml(data.error || 'Something went wrong.'), true);
    } else {
      replaceTyping(renderMarkdown(data.reply || ''), false, data.annotated_image);
    }
  } catch (err) {
    replaceTyping('Could not reach the server. Is server.py still running?', true);
  } finally {
    setBusy(false);
  }
});

updateSendState();
</script>
</body>
</html>
