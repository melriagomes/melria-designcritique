<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Critique Chat</title>
<script>
// Applied before first paint so the stored theme/text-size preference never flashes wrong.
(function () {
  try {
    var theme = localStorage.getItem('designCritiqueTheme') || 'system';
    var resolved = (theme === 'dark' || theme === 'light') ? theme :
      ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', resolved);
    document.documentElement.style.fontSize = (localStorage.getItem('designCritiqueScale') || '100') + '%';
  } catch (err) {}
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #EEEBE2;
    --panel: #ffffff;
    --panel-soft: #F4F1E9;
    --border: #D8D2C0;
    --text: #1D1B16;
    --muted: #746B58;
    --structure: #2F5D6B;
    --accent: #C62828;
    --accent-text: #B71C1C;
    --accent-hover: #A31F1F;
    --accent-soft: #F4D9D6;
    --accent-ink: #ffffff;
    --agent-bubble: #ffffff;
    --user-bubble: #1D1B16;
    --error-bg: #FBE4E1;
    --error-border: #E3A99C;
    --error-text: #7A2A1F;
  }
  /* Dark palette derived from the same warm-ink/crit-red system, tuned to
     meet WCAG AA contrast (>=4.5:1 body text, >=3:1 large text/UI edges). */
  :root[data-theme="dark"] {
    --bg: #17140F;
    --panel: #201C15;
    --panel-soft: #262019;
    --border: #3C3527;
    --text: #F1ECDE;
    --muted: #B3A98C;
    --structure: #7FB8C7;
    --accent: #FF6B58;
    --accent-text: #FF8A78;
    --accent-hover: #FF8A78;
    --accent-soft: #4A2620;
    --accent-ink: #1A0E0B;
    --agent-bubble: #201C15;
    --user-bubble: #F1ECDE;
    --error-bg: #3A1712;
    --error-border: #6B372B;
    --error-text: #FFC9BA;
  }
  * { box-sizing: border-box; }
  html { font-size: 100%; }
  .material-symbols-outlined {
    font-variation-settings: 'opsz' 24, 'wght' 400, 'FILL' 0, 'GRAD' 0;
    font-size: 1.25rem;
    line-height: 1;
    vertical-align: middle;
    user-select: none;
  }
  body {
    margin: 0;
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 1080px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
  }
  @media (min-width: 860px) {
    body { padding: 28px 16px; }
    .app {
      height: calc(100vh - 56px);
      margin: 0 auto;
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }
  }
  header {
    padding: 1.25rem 2rem;
    border-bottom: 1px solid var(--border);
    background: var(--panel-soft);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem;
  }
  header h1 { font-size: 1.125rem; margin: 0; color: var(--text); font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 0.1875rem 0 0; font-size: 0.845rem; color: var(--muted); }
  #settingsBtn {
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0.375rem;
    line-height: 1;
    color: var(--muted);
    border-radius: 50%;
    flex-shrink: 0;
    display: inline-flex;
  }
  #settingsBtn:hover { background: var(--accent-soft); color: var(--accent-text); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 2rem 2.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.125rem;
  }

  .msg { display: flex; flex-direction: column; max-width: 70%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.agent { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 0.75rem 1rem;
    border-radius: 0.5rem;
    font-size: 0.9375rem;
    line-height: 1.55;
    word-wrap: break-word;
  }
  .bubble strong { color: var(--accent-text); font-weight: 600; }
  .msg.user .bubble { background: var(--user-bubble); color: var(--bg); border-radius: 0.5rem 0.5rem 0.125rem 0.5rem; }
  .msg.user .bubble strong { color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; }
  .msg.agent .bubble { background: var(--agent-bubble); border: 1px solid var(--border); border-radius: 0.5rem 0.5rem 0.5rem 0.125rem; }
  .msg.error .bubble { background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text); }

  .msg .thumb {
    max-width: 13.75rem;
    max-height: 13.75rem;
    border-radius: 0.375rem;
    margin-bottom: 0.375rem;
    display: block;
  }
  .msg .note {
    margin-top: 4px;
    font-size: 0.75rem;
    font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    opacity: 0.85;
    white-space: pre-line;
  }
  .msg .annotated {
    display: block;
    max-width: 100%;
    border-radius: 0.375rem;
    margin-bottom: 10px;
    border: 1px solid var(--border);
  }
  .msg .url-chip {
    font-size: 0.8125rem;
    font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    text-decoration: underline;
    word-break: break-all;
  }

  .bubble h2 { font-size: 1rem; margin: 0 0 0.5rem; color: var(--text); font-weight: 600; }
  .bubble h3 { font-size: 0.875rem; margin: 0.875rem 0 0.375rem; color: var(--structure); font-weight: 600; }
  .bubble p { margin: 0 0 0.5rem; }
  .bubble ul, .bubble ol { margin: 0 0 0.5rem; padding-left: 1.25rem; }
  .bubble li { margin-bottom: 0.25rem; }

  .typing { display: inline-flex; gap: 0.25rem; padding: 0.25rem 0; }
  .typing span {
    width: 0.375rem; height: 0.375rem; border-radius: 50%; background: var(--accent-soft);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  #composer {
    border-top: 1px solid var(--border);
    padding: 1.125rem 2.5rem 1.625rem;
    background: var(--panel);
  }

  .mode-toggle {
    display: flex;
    gap: 1.5rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1rem;
  }
  .mode-toggle button {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    border: none;
    border-bottom: 2px solid transparent;
    background: transparent;
    padding: 0 0 0.5625rem;
    margin-bottom: -1px;
    font-size: 0.845rem;
    font-family: inherit;
    cursor: pointer;
    color: var(--muted);
  }
  .mode-toggle button.active {
    color: var(--text);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }

  .mode-panel { display: none; }
  .mode-panel.active { display: block; }

  .attach-row {
    display: flex;
    align-items: center;
    gap: 0.625rem;
    margin-bottom: 0.625rem;
  }
  .attach-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    border: 1px dashed var(--border);
    background: var(--panel-soft);
    border-radius: 0.375rem;
    padding: 0.5625rem 0.875rem;
    font-size: 0.845rem;
    cursor: pointer;
    color: var(--text);
  }
  .attach-btn:hover { border-color: var(--structure); }
  .file-preview {
    display: none;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8125rem;
    color: var(--muted);
  }
  .file-preview img { width: 2rem; height: 2rem; object-fit: cover; border-radius: 0.25rem; }
  .file-preview button {
    border: none; background: none; color: var(--muted); cursor: pointer; font-size: 0.8125rem; text-decoration: underline;
  }

  #urlInput, #audienceInput, #goalsInput, #noteInput {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 0.375rem;
    padding: 0.6875rem 0.875rem;
    font-size: 0.90625rem;
    font-family: inherit;
    margin-bottom: 0.625rem;
    resize: none;
    background: var(--panel);
    color: var(--text);
  }
  #urlInput:focus, #audienceInput:focus, #goalsInput:focus, #noteInput:focus { outline: none; border-color: var(--accent); }
  #noteInput { min-height: 2.625rem; }

  .send-row { display: flex; justify-content: flex-end; }
  #sendBtn {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 0.375rem;
    padding: 0.625rem 1.375rem;
    font-size: 0.90625rem;
    font-weight: 600;
    cursor: pointer;
  }
  #sendBtn:hover:not(:disabled) { background: var(--accent-hover); }
  #sendBtn:disabled { opacity: 0.45; cursor: not-allowed; }

  .hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.375rem; }

  .download-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.375rem;
    margin-top: 0.5rem;
  }
  .download-label { font-size: 0.78125rem; color: var(--muted); margin-right: 0.125rem; }
  .download-bar button {
    display: inline-flex;
    align-items: center;
    gap: 0.3125rem;
    border: 1px solid var(--border);
    background: var(--panel-soft);
    color: var(--text);
    border-radius: 0.375rem;
    padding: 0.375rem 0.75rem;
    font-size: 0.8125rem;
    font-family: inherit;
    cursor: pointer;
  }
  .download-bar button .material-symbols-outlined { font-size: 1rem; color: var(--structure); }
  .download-bar button:hover:not(:disabled) { border-color: var(--accent); }
  .download-bar button:disabled { opacity: 0.55; cursor: progress; }
  .download-status { font-size: 0.78125rem; color: var(--muted); }

  #settingsOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--bg);
  }
  #settingsOverlay.open { display: block; }
  #settingsFrame { width: 100%; height: 100%; border: 0; display: block; }
  body.settings-open { overflow: hidden; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Design Critique Agent</h1>
      <p>Send an image or a URL — get back a structured critique with concrete fixes.</p>
    </div>
    <button id="settingsBtn" type="button" title="Settings" aria-label="Settings"><span class="material-symbols-outlined">settings</span></button>
  </header>

  <div id="messages"></div>

  <div id="composer">
    <div class="mode-toggle">
      <button id="tabImage" class="active" type="button"><span class="material-symbols-outlined">image</span> Image</button>
      <button id="tabUrl" type="button"><span class="material-symbols-outlined">link</span> URL</button>
    </div>

    <div id="panelImage" class="mode-panel active">
      <div class="attach-row">
        <button class="attach-btn" id="attachBtn" type="button"><span class="material-symbols-outlined">attach_file</span> Choose image…</button>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
        <div class="file-preview" id="filePreview">
          <img id="previewThumb" alt="">
          <span id="previewName"></span>
          <button id="removeFile" type="button">remove</button>
        </div>
      </div>
    </div>

    <div id="panelUrl" class="mode-panel">
      <input type="text" id="urlInput" placeholder="https://example.com/screen-to-critique or a figma.com file/design link">
    </div>

    <input type="text" id="audienceInput" placeholder="Intended audience (optional, e.g. “new users on mobile”)">
    <input type="text" id="goalsInput" placeholder="Design goal (optional, e.g. “increase signups”)">
    <textarea id="noteInput" placeholder="Optional note (e.g. “focus on the checkout flow”)"></textarea>

    <div class="send-row">
      <button id="sendBtn" disabled>Send <span class="material-symbols-outlined">send</span></button>
    </div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<div id="settingsOverlay" role="dialog" aria-modal="true" aria-label="Settings">
  <iframe id="settingsFrame" title="Settings"></iframe>
</div>

<script>
const messagesEl = document.getElementById('messages');
const tabImage = document.getElementById('tabImage');
const tabUrl = document.getElementById('tabUrl');
const panelImage = document.getElementById('panelImage');
const panelUrl = document.getElementById('panelUrl');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');
const filePreview = document.getElementById('filePreview');
const previewThumb = document.getElementById('previewThumb');
const previewName = document.getElementById('previewName');
const removeFile = document.getElementById('removeFile');
const urlInput = document.getElementById('urlInput');
const audienceInput = document.getElementById('audienceInput');
const goalsInput = document.getElementById('goalsInput');
const noteInput = document.getElementById('noteInput');
const sendBtn = document.getElementById('sendBtn');
const hint = document.getElementById('hint');
const settingsBtn = document.getElementById('settingsBtn');

const API_KEYS_STORAGE = 'designCritiqueApiKeys';
const ACTIVE_KEY_ID_STORAGE = 'designCritiqueActiveApiKeyId';
const AI_KEY_STORAGE = 'designCritiqueAiApiKey';

// Settings opens in an overlay (an iframe of /settings) rather than
// navigating away, so a critique that's still running keeps going — leaving
// this page would abort the in-flight request and drop the chat.
const settingsOverlay = document.getElementById('settingsOverlay');
const settingsFrame = document.getElementById('settingsFrame');

function applyDisplayPrefs() {
  try {
    const theme = localStorage.getItem('designCritiqueTheme') || 'system';
    const resolved = (theme === 'dark' || theme === 'light') ? theme :
      ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', resolved);
    document.documentElement.style.fontSize = (localStorage.getItem('designCritiqueScale') || '100') + '%';
  } catch (err) {}
}

function openSettings() {
  settingsFrame.src = '/settings?embedded=1'; // fresh load each time so it shows current keys
  settingsOverlay.classList.add('open');
  document.body.classList.add('settings-open');
  settingsFrame.focus();
}

function closeSettings() {
  settingsOverlay.classList.remove('open');
  document.body.classList.remove('settings-open');
  applyDisplayPrefs();
  settingsBtn.focus();
}

settingsBtn.addEventListener('click', openSettings);

window.addEventListener('message', (e) => {
  if (e.origin === window.location.origin && e.data && e.data.type === 'closeSettings') closeSettings();
});

// Theme / text-size changes made in the Settings overlay apply here live.
window.addEventListener('storage', (e) => {
  if (e.key === 'designCritiqueTheme' || e.key === 'designCritiqueScale') applyDisplayPrefs();
});

// Returns the visitor's own AI key from Settings as {provider, key, model},
// or null to use the server's shared key. An older plain-string value is a
// bare key; the server then detects its provider from the prefix.
function getAiKeyConfig() {
  try {
    const raw = localStorage.getItem(AI_KEY_STORAGE);
    if (!raw) return null;
    try {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.key) return parsed;
    } catch (err) {}
    return { provider: '', key: raw, model: '' };
  } catch (err) {
    return null;
  }
}

// Returns the value of whichever saved key is marked active in Settings, or
// null if none is set — matches the list settings.html manages.
function getActiveApiKeyValue() {
  try {
    const keys = JSON.parse(localStorage.getItem(API_KEYS_STORAGE) || '[]');
    const activeId = localStorage.getItem(ACTIVE_KEY_ID_STORAGE);
    const active = keys.find((k) => k.id === activeId);
    return active ? active.value : null;
  } catch (err) {
    return null;
  }
}

let mode = 'image';
let selectedFile = null;
let busy = false;

function setMode(next) {
  mode = next;
  tabImage.classList.toggle('active', mode === 'image');
  tabUrl.classList.toggle('active', mode === 'url');
  panelImage.classList.toggle('active', mode === 'image');
  panelUrl.classList.toggle('active', mode === 'url');
  updateSendState();
}
tabImage.addEventListener('click', () => setMode('image'));
tabUrl.addEventListener('click', () => setMode('url'));

attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  selectedFile = file;
  previewName.textContent = file.name;
  previewThumb.src = URL.createObjectURL(file);
  filePreview.style.display = 'flex';
  updateSendState();
});
removeFile.addEventListener('click', () => {
  selectedFile = null;
  fileInput.value = '';
  filePreview.style.display = 'none';
  updateSendState();
});
urlInput.addEventListener('input', updateSendState);

function updateSendState() {
  const ready = busy ? false : (mode === 'image' ? !!selectedFile : urlInput.value.trim().length > 0);
  sendBtn.disabled = !ready;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function inline(s) {
  return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

// Minimal Markdown -> HTML for the fixed critique structure (##, ###, -, 1., blank-line paragraphs).
function renderMarkdown(md) {
  const lines = md.split('\n');
  let html = '';
  let listType = null; // 'ul' | 'ol' | null
  let paragraph = [];

  function flushParagraph() {
    if (paragraph.length) {
      html += `<p>${paragraph.join(' ')}</p>`;
      paragraph = [];
    }
  }
  function closeList() {
    if (listType) { html += `</${listType}>`; listType = null; }
  }

  for (const raw of lines) {
    const line = raw.trim();
    if (line === '') { flushParagraph(); closeList(); continue; }

    if (line.startsWith('### ')) {
      flushParagraph(); closeList();
      html += `<h3>${inline(line.slice(4))}</h3>`;
    } else if (line.startsWith('## ')) {
      flushParagraph(); closeList();
      html += `<h2>${inline(line.slice(3))}</h2>`;
    } else if (/^[-*]\s+/.test(line)) {
      flushParagraph();
      if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
      html += `<li>${inline(line.replace(/^[-*]\s+/, ''))}</li>`;
    } else if (/^\d+\.\s+/.test(line)) {
      flushParagraph();
      if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
      html += `<li>${inline(line.replace(/^\d+\.\s+/, ''))}</li>`;
    } else {
      closeList();
      paragraph.push(inline(line));
    }
  }
  flushParagraph();
  closeList();
  return html;
}

function addUserMessage({ file, url, note, audience, goals }) {
  const wrap = document.createElement('div');
  wrap.className = 'msg user';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (file) {
    const img = document.createElement('img');
    img.className = 'thumb';
    img.src = URL.createObjectURL(file);
    bubble.appendChild(img);
  } else if (url) {
    const chip = document.createElement('div');
    chip.className = 'url-chip';
    chip.textContent = url;
    bubble.appendChild(chip);
  }
  const extraLines = [];
  if (audience) extraLines.push(`Audience: ${audience}`);
  if (goals) extraLines.push(`Goal: ${goals}`);
  if (note) extraLines.push(note);
  if (extraLines.length) {
    const noteEl = document.createElement('div');
    noteEl.className = 'note';
    noteEl.textContent = extraLines.join('\n');
    bubble.appendChild(noteEl);
  }
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  scrollToBottom();
}

function addTypingBubble() {
  const wrap = document.createElement('div');
  wrap.className = 'msg agent';
  wrap.id = 'typingBubble';
  wrap.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(wrap);
  scrollToBottom();
  return wrap;
}

function replaceTyping(html, isError, annotatedImageDataUrl) {
  const typing = document.getElementById('typingBubble');
  if (!typing) return;
  typing.className = isError ? 'msg error' : 'msg agent';
  typing.id = '';
  const imgHtml = annotatedImageDataUrl
    ? `<img class="annotated" src="${annotatedImageDataUrl}" alt="Annotated design with numbered callouts">`
    : '';
  typing.querySelector('.bubble').innerHTML = imgHtml + html;
  scrollToBottom();
  return typing;
}

// --- Downloads -------------------------------------------------------------
// Markdown is assembled here; PDF and Word are rendered by the server
// (/api/export) from the same Markdown and annotated image.

function exportFilename(ext) {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  return `design-critique-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.${ext}`;
}

function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function critiqueMarkdownFile(markdown, imageDataUrl) {
  const image = imageDataUrl ? `![Annotated design with numbered callouts](${imageDataUrl})\n\n` : '';
  return `# Design Critique\n\n${image}${markdown.trim()}\n`;
}

function addDownloadBar(msgEl, markdown, imageDataUrl) {
  const bar = document.createElement('div');
  bar.className = 'download-bar';
  bar.innerHTML = '<span class="download-label">Download</span>';
  const status = document.createElement('span');
  status.className = 'download-status';
  status.setAttribute('role', 'status');

  const formats = [
    { key: 'pdf', label: 'PDF', icon: 'picture_as_pdf' },
    { key: 'md', label: 'Markdown', icon: 'code' },
    { key: 'docx', label: 'Word', icon: 'description' },
  ];
  formats.forEach(({ key, label, icon }) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.innerHTML = `<span class="material-symbols-outlined">${icon}</span> ${label}`;
    btn.setAttribute('aria-label', `Download critique as ${label}`);
    btn.addEventListener('click', async () => {
      status.textContent = '';
      if (key === 'md') {
        saveBlob(new Blob([critiqueMarkdownFile(markdown, imageDataUrl)], { type: 'text/markdown' }), exportFilename('md'));
        return;
      }
      btn.disabled = true;
      status.textContent = `Preparing ${label}…`;
      try {
        const res = await fetch('/api/export', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ format: key, markdown, image: imageDataUrl || null }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          status.textContent = data.error || `Couldn't create the ${label} file (HTTP ${res.status}).`;
          return;
        }
        saveBlob(await res.blob(), exportFilename(key));
        status.textContent = '';
      } catch (err) {
        status.textContent = `Couldn't reach the server to create the ${label} file.`;
      } finally {
        btn.disabled = false;
      }
    });
    bar.appendChild(btn);
  });
  bar.appendChild(status);
  msgEl.appendChild(bar);
  scrollToBottom();
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setBusy(next) {
  busy = next;
  sendBtn.innerHTML = busy
    ? 'Critiquing… <span class="material-symbols-outlined">hourglass_top</span>'
    : 'Send <span class="material-symbols-outlined">send</span>';
  updateSendState();
}

sendBtn.addEventListener('click', async () => {
  if (busy) return;
  const note = noteInput.value.trim();
  const audience = audienceInput.value.trim();
  const goals = goalsInput.value.trim();
  const formData = new FormData();

  if (mode === 'image') {
    if (!selectedFile) return;
    formData.append('image', selectedFile);
    addUserMessage({ file: selectedFile, note, audience, goals });
  } else {
    const url = urlInput.value.trim();
    if (!url) return;
    formData.append('url', url);
    addUserMessage({ url, note, audience, goals });
  }
  if (note) formData.append('note', note);
  if (audience) formData.append('audience', audience);
  if (goals) formData.append('goals', goals);

  // Attach whichever Figma key this visitor marked active in Settings, if
  // any — only used for figma.com links. Falls back to the server's shared
  // Figma token when absent.
  const activeKey = getActiveApiKeyValue();
  if (activeKey) formData.append('access_token', activeKey);

  // Attach the visitor's own AI key (Anthropic, OpenAI, Gemini, or Groq), if
  // set — the server uses it instead of its shared GROQ_API_KEY for this
  // request only.
  const aiKey = getAiKeyConfig();
  if (aiKey) {
    formData.append('ai_api_key', aiKey.key);
    if (aiKey.provider) formData.append('ai_provider', aiKey.provider);
    if (aiKey.model) formData.append('ai_model', aiKey.model);
  }

  // Reset composer for the next turn.
  const usedFile = selectedFile;
  selectedFile = null;
  fileInput.value = '';
  filePreview.style.display = 'none';
  urlInput.value = '';
  audienceInput.value = '';
  goalsInput.value = '';
  noteInput.value = '';
  hint.textContent = '';

  setBusy(true);
  addTypingBubble();

  try {
    const res = await fetch('/api/critique', { method: 'POST', body: formData });
    // A proxy/server error page isn't JSON — fall back to the status code.
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      replaceTyping(escapeHtml(data.error || `Something went wrong (HTTP ${res.status}). Please try again.`), true);
    } else {
      const msgEl = replaceTyping(renderMarkdown(data.reply || ''), false, data.annotated_image);
      if (msgEl && data.reply) addDownloadBar(msgEl, data.reply, data.annotated_image);
    }
  } catch (err) {
    replaceTyping('Could not reach the server. Is server.py still running?', true);
  } finally {
    setBusy(false);
  }
});

updateSendState();
</script>
</body>
