<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Critique Chat</title>
<script>
// Applied before first paint so the stored theme/text-size preference never flashes wrong.
(function () {
  try {
    var theme = localStorage.getItem('designCritiqueTheme') || 'system';
    var resolved = (theme === 'dark' || theme === 'light') ? theme :
      ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', resolved);
    document.documentElement.style.fontSize = (localStorage.getItem('designCritiqueScale') || '100') + '%';
  } catch (err) {}
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0" />
<style>
  :root {
    --bg: #FFF1F1;
    --panel: #ffffff;
    --panel-soft: #FBEBFE;
    --border: #F1D6F8;
    --text: #3B0270;
    --muted: #8B6BA8;
    --accent: #6F00FF;
    --accent-text: #6F00FF;
    --accent-hover: #5c00d1;
    --accent-soft: #E9B3FB;
    --accent-ink: #ffffff;
    --agent-bubble: #ffffff;
    --user-bubble: #6F00FF;
    --error-bg: #fdecea;
    --error-border: #f5b5ac;
    --error-text: #7a271a;
  }
  /* Dark palette derived from the same brand colors, tuned to meet WCAG AA
     contrast (>=4.5:1 for body text, >=3:1 for large text/UI boundaries)
     against the dark backgrounds below. */
  :root[data-theme="dark"] {
    --bg: #1B0430;
    --panel: #241040;
    --panel-soft: #2E1550;
    --border: #4A2470;
    --text: #F3E9FB;
    --muted: #C9AEDD;
    --accent: #8A2BFF;
    --accent-text: #C89CFF;
    --accent-hover: #7A22E6;
    --accent-soft: #5A2F86;
    --accent-ink: #ffffff;
    --agent-bubble: #241040;
    --user-bubble: #8A2BFF;
    --error-bg: #451515;
    --error-border: #7a3a3a;
    --error-text: #FFB4A8;
  }
  * { box-sizing: border-box; }
  html { font-size: 100%; }
  .material-symbols-outlined {
    font-variation-settings: 'opsz' 24, 'wght' 400, 'FILL' 0, 'GRAD' 0;
    font-size: 1.25rem;
    line-height: 1;
    vertical-align: middle;
    user-select: none;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 1080px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
  }
  @media (min-width: 860px) {
    body { padding: 28px 16px; }
    .app {
      height: calc(100vh - 56px);
      margin: 0 auto;
      border-radius: 22px;
      border: 1px solid var(--border);
      box-shadow: 0 12px 40px rgba(59, 2, 112, 0.10);
      overflow: hidden;
    }
  }
  header {
    padding: 1.25rem 2rem;
    border-bottom: 1px solid var(--border);
    background: var(--panel-soft);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem;
  }
  header h1 { font-size: 1.125rem; margin: 0; color: var(--text); }
  header p { margin: 0.1875rem 0 0; font-size: 0.845rem; color: var(--muted); }
  #settingsBtn {
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0.375rem;
    line-height: 1;
    color: var(--muted);
    border-radius: 50%;
    flex-shrink: 0;
    display: inline-flex;
  }
  #settingsBtn:hover { background: var(--accent-soft); color: var(--text); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 2rem 2.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.125rem;
  }

  .msg { display: flex; flex-direction: column; max-width: 70%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.agent { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 0.75rem 1rem;
    border-radius: 1rem;
    font-size: 0.9375rem;
    line-height: 1.55;
    word-wrap: break-word;
  }
  .bubble strong { color: var(--accent-text); }
  .msg.user .bubble { background: var(--user-bubble); color: var(--accent-ink); border-radius: 1rem 1rem 0.25rem 1rem; }
  .msg.user .bubble strong { color: #ffffff; text-decoration: underline; text-decoration-color: rgba(255,255,255,0.55); }
  .msg.agent .bubble { background: var(--agent-bubble); border: 1px solid var(--border); border-radius: 1rem 1rem 1rem 0.25rem; }
  .msg.error .bubble { background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text); }

  .msg .thumb {
    max-width: 13.75rem;
    max-height: 13.75rem;
    border-radius: 0.625rem;
    margin-bottom: 0.375rem;
    display: block;
  }
  .msg .note { margin-top: 4px; font-size: 13px; opacity: 0.9; }
  .msg .annotated {
    display: block;
    max-width: 100%;
    border-radius: 10px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
  }
  .msg .note { margin-top: 0.25rem; font-size: 0.8125rem; opacity: 0.9; }
  .msg .url-chip {
    font-size: 0.8125rem;
    text-decoration: underline;
    word-break: break-all;
  }

  .bubble h2 { font-size: 1rem; margin: 0 0 0.5rem; color: var(--text); }
  .bubble h3 { font-size: 0.875rem; margin: 0.875rem 0 0.375rem; color: var(--accent-text); }
  .bubble p { margin: 0 0 0.5rem; }
  .bubble ul, .bubble ol { margin: 0 0 0.5rem; padding-left: 1.25rem; }
  .bubble li { margin-bottom: 0.25rem; }

  .typing { display: inline-flex; gap: 0.25rem; padding: 0.25rem 0; }
  .typing span {
    width: 0.375rem; height: 0.375rem; border-radius: 50%; background: var(--accent-soft);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  #composer {
    border-top: 1px solid var(--border);
    padding: 1.125rem 2.5rem 1.625rem;
    background: var(--panel);
  }

  .mode-toggle {
    display: inline-flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 0.625rem;
    padding: 0.1875rem;
    margin-bottom: 0.75rem;
  }
  .mode-toggle button {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    border: none;
    background: transparent;
    padding: 0.4375rem 1rem;
    font-size: 0.845rem;
    border-radius: 0.5rem;
    cursor: pointer;
    color: var(--muted);
  }
  .mode-toggle button.active {
    background: var(--panel);
    color: var(--accent-text);
    box-shadow: 0 1px 3px rgba(59,2,112,0.12);
    font-weight: 600;
  }

  .mode-panel { display: none; }
  .mode-panel.active { display: block; }

  .attach-row {
    display: flex;
    align-items: center;
    gap: 0.625rem;
    margin-bottom: 0.625rem;
  }
  .attach-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    border: 1px dashed var(--accent-soft);
    background: var(--panel-soft);
    border-radius: 0.625rem;
    padding: 0.5625rem 0.875rem;
    font-size: 0.845rem;
    cursor: pointer;
    color: var(--text);
  }
  .file-preview {
    display: none;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8125rem;
    color: var(--muted);
  }
  .file-preview img { width: 2rem; height: 2rem; object-fit: cover; border-radius: 0.375rem; }
  .file-preview button {
    border: none; background: none; color: var(--muted); cursor: pointer; font-size: 0.8125rem; text-decoration: underline;
  }

  #urlInput, #audienceInput, #goalsInput, #noteInput {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 0.625rem;
    padding: 0.6875rem 0.875rem;
    font-size: 0.90625rem;
    font-family: inherit;
    margin-bottom: 0.625rem;
    resize: none;
    background: var(--panel);
    color: var(--text);
  }
  #urlInput:focus, #noteInput:focus { outline: none; border-color: var(--accent); }
  #noteInput { min-height: 2.625rem; }

  .send-row { display: flex; justify-content: flex-end; }
  #sendBtn {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 0.625rem;
    padding: 0.625rem 1.375rem;
    font-size: 0.90625rem;
    font-weight: 600;
    cursor: pointer;
  }
  #sendBtn:hover:not(:disabled) { background: var(--accent-hover); }
  #sendBtn:disabled { opacity: 0.45; cursor: not-allowed; }

  .hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.375rem; }

  #settingsOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--bg);
  }
  #settingsOverlay.open { display: block; }
  #settingsFrame { width: 100%; height: 100%; border: 0; display: block; }
  body.settings-open { overflow: hidden; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Design Critique Agent</h1>
      <p>Send an image or a URL — get back a structured critique with concrete fixes.</p>
    </div>
    <button id="settingsBtn" type="button" title="Settings" aria-label="Settings"><span class="material-symbols-outlined">settings</span></button>
  </header>

  <div id="messages"></div>

  <div id="composer">
    <div class="mode-toggle">
      <button id="tabImage" class="active" type="button"><span class="material-symbols-outlined">image</span> Image</button>
      <button id="tabUrl" type="button"><span class="material-symbols-outlined">link</span> URL</button>
    </div>

    <div id="panelImage" class="mode-panel active">
      <div class="attach-row">
        <button class="attach-btn" id="attachBtn" type="button"><span class="material-symbols-outlined">attach_file</span> Choose image…</button>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
        <div class="file-preview" id="filePreview">
          <img id="previewThumb" alt="">
          <span id="previewName"></span>
          <button id="removeFile" type="button">remove</button>
        </div>
      </div>
    </div>

    <div id="panelUrl" class="mode-panel">
      <input type="text" id="urlInput" placeholder="https://example.com/screen-to-critique or a figma.com file/design link">
    </div>

    <input type="text" id="audienceInput" placeholder="Intended audience (optional, e.g. “new users on mobile”)">
    <input type="text" id="goalsInput" placeholder="Design goal (optional, e.g. “increase signups”)">
    <textarea id="noteInput" placeholder="Optional note (e.g. “focus on the checkout flow”)"></textarea>

    <div class="send-row">
      <button id="sendBtn" disabled>Send <span class="material-symbols-outlined">send</span></button>
    </div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<div id="settingsOverlay" role="dialog" aria-modal="true" aria-label="Settings">
  <iframe id="settingsFrame" title="Settings"></iframe>
</div>

<script>
const messagesEl = document.getElementById('messages');
const tabImage = document.getElementById('tabImage');
const tabUrl = document.getElementById('tabUrl');
const panelImage = document.getElementById('panelImage');
const panelUrl = document.getElementById('panelUrl');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');
const filePreview = document.getElementById('filePreview');
const previewThumb = document.getElementById('previewThumb');
const previewName = document.getElementById('previewName');
const removeFile = document.getElementById('removeFile');
const urlInput = document.getElementById('urlInput');
const audienceInput = document.getElementById('audienceInput');
const goalsInput = document.getElementById('goalsInput');
const noteInput = document.getElementById('noteInput');
const sendBtn = document.getElementById('sendBtn');
const hint = document.getElementById('hint');
const settingsBtn = document.getElementById('settingsBtn');

const API_KEYS_STORAGE = 'designCritiqueApiKeys';
const ACTIVE_KEY_ID_STORAGE = 'designCritiqueActiveApiKeyId';
const AI_KEY_STORAGE = 'designCritiqueAiApiKey';

// Settings opens in an overlay (an iframe of /settings) rather than
// navigating away, so a critique that's still running keeps going — leaving
// this page would abort the in-flight request and drop the chat.
const settingsOverlay = document.getElementById('settingsOverlay');
const settingsFrame = document.getElementById('settingsFrame');

function applyDisplayPrefs() {
  try {
    const theme = localStorage.getItem('designCritiqueTheme') || 'system';
    const resolved = (theme === 'dark' || theme === 'light') ? theme :
      ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', resolved);
    document.documentElement.style.fontSize = (localStorage.getItem('designCritiqueScale') || '100') + '%';
  } catch (err) {}
}

function openSettings() {
  settingsFrame.src = '/settings?embedded=1'; // fresh load each time so it shows current keys
  settingsOverlay.classList.add('open');
  document.body.classList.add('settings-open');
  settingsFrame.focus();
}

function closeSettings() {
  settingsOverlay.classList.remove('open');
  document.body.classList.remove('settings-open');
  applyDisplayPrefs();
  settingsBtn.focus();
}

settingsBtn.addEventListener('click', openSettings);

window.addEventListener('message', (e) => {
  if (e.origin === window.location.origin && e.data && e.data.type === 'closeSettings') closeSettings();
});

// Theme / text-size changes made in the Settings overlay apply here live.
window.addEventListener('storage', (e) => {
  if (e.key === 'designCritiqueTheme' || e.key === 'designCritiqueScale') applyDisplayPrefs();
});

// Returns the visitor's own AI (Groq) API key from Settings, or null to use
// the server's shared key.
function getAiApiKeyValue() {
  try {
    return localStorage.getItem(AI_KEY_STORAGE) || null;
  } catch (err) {
    return null;
  }
}

// Returns the value of whichever saved key is marked active in Settings, or
// null if none is set — matches the list settings.html manages.
function getActiveApiKeyValue() {
  try {
    const keys = JSON.parse(localStorage.getItem(API_KEYS_STORAGE) || '[]');
    const activeId = localStorage.getItem(ACTIVE_KEY_ID_STORAGE);
    const active = keys.find((k) => k.id === activeId);
    return active ? active.value : null;
  } catch (err) {
    return null;
  }
}

let mode = 'image';
let selectedFile = null;
let busy = false;

function setMode(next) {
  mode = next;
  tabImage.classList.toggle('active', mode === 'image');
  tabUrl.classList.toggle('active', mode === 'url');
  panelImage.classList.toggle('active', mode === 'image');
  panelUrl.classList.toggle('active', mode === 'url');
  updateSendState();
}
tabImage.addEventListener('click', () => setMode('image'));
tabUrl.addEventListener('click', () => setMode('url'));

attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  selectedFile = file;
  previewName.textContent = file.name;
  previewThumb.src = URL.createObjectURL(file);
  filePreview.style.display = 'flex';
  updateSendState();
});
removeFile.addEventListener('click', () => {
  selectedFile = null;
  fileInput.value = '';
  filePreview.style.display = 'none';
  updateSendState();
});
urlInput.addEventListener('input', updateSendState);

function updateSendState() {
  const ready = busy ? false : (mode === 'image' ? !!selectedFile : urlInput.value.trim().length > 0);
  sendBtn.disabled = !ready;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function inline(s) {
  return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

// Minimal Markdown -> HTML for the fixed critique structure (##, ###, -, 1., blank-line paragraphs).
function renderMarkdown(md) {
  const lines = md.split('\n');
  let html = '';
  let listType = null; // 'ul' | 'ol' | null
  let paragraph = [];

  function flushParagraph() {
    if (paragraph.length) {
      html += `<p>${paragraph.join(' ')}</p>`;
      paragraph = [];
    }
  }
  function closeList() {
    if (listType) { html += `</${listType}>`; listType = null; }
  }

  for (const raw of lines) {
    const line = raw.trim();
    if (line === '') { flushParagraph(); closeList(); continue; }

    if (line.startsWith('### ')) {
      flushParagraph(); closeList();
      html += `<h3>${inline(line.slice(4))}</h3>`;
    } else if (line.startsWith('## ')) {
      flushParagraph(); closeList();
      html += `<h2>${inline(line.slice(3))}</h2>`;
    } else if (/^[-*]\s+/.test(line)) {
      flushParagraph();
      if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
      html += `<li>${inline(line.replace(/^[-*]\s+/, ''))}</li>`;
    } else if (/^\d+\.\s+/.test(line)) {
      flushParagraph();
      if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
      html += `<li>${inline(line.replace(/^\d+\.\s+/, ''))}</li>`;
    } else {
      closeList();
      paragraph.push(inline(line));
    }
  }
  flushParagraph();
  closeList();
  return html;
}

function addUserMessage({ file, url, note, audience, goals }) {
  const wrap = document.createElement('div');
  wrap.className = 'msg user';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (file) {
    const img = document.createElement('img');
    img.className = 'thumb';
    img.src = URL.createObjectURL(file);
    bubble.appendChild(img);
  } else if (url) {
    const chip = document.createElement('div');
    chip.className = 'url-chip';
    chip.textContent = url;
    bubble.appendChild(chip);
  }
  const extraLines = [];
  if (audience) extraLines.push(`Audience: ${audience}`);
  if (goals) extraLines.push(`Goal: ${goals}`);
  if (note) extraLines.push(note);
  if (extraLines.length) {
    const noteEl = document.createElement('div');
    noteEl.className = 'note';
    noteEl.textContent = extraLines.join(' · ');
    bubble.appendChild(noteEl);
  }
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  scrollToBottom();
}

function addTypingBubble() {
  const wrap = document.createElement('div');
  wrap.className = 'msg agent';
  wrap.id = 'typingBubble';
  wrap.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(wrap);
  scrollToBottom();
  return wrap;
}

function replaceTyping(html, isError, annotatedImageDataUrl) {
  const typing = document.getElementById('typingBubble');
  if (!typing) return;
  typing.className = isError ? 'msg error' : 'msg agent';
  typing.id = '';
  const imgHtml = annotatedImageDataUrl
    ? `<img class="annotated" src="${annotatedImageDataUrl}" alt="Annotated design with numbered callouts">`
    : '';
  typing.querySelector('.bubble').innerHTML = imgHtml + html;
  scrollToBottom();
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setBusy(next) {
  busy = next;
  sendBtn.innerHTML = busy
    ? 'Critiquing… <span class="material-symbols-outlined">hourglass_top</span>'
    : 'Send <span class="material-symbols-outlined">send</span>';
  updateSendState();
}

sendBtn.addEventListener('click', async () => {
  if (busy) return;
  const note = noteInput.value.trim();
  const audience = audienceInput.value.trim();
  const goals = goalsInput.value.trim();
  const formData = new FormData();

  if (mode === 'image') {
    if (!selectedFile) return;
    formData.append('image', selectedFile);
    addUserMessage({ file: selectedFile, note, audience, goals });
  } else {
    const url = urlInput.value.trim();
    if (!url) return;
    formData.append('url', url);
    addUserMessage({ url, note, audience, goals });
  }
  if (note) formData.append('note', note);
  if (audience) formData.append('audience', audience);
  if (goals) formData.append('goals', goals);

  // Attach whichever Figma key this visitor marked active in Settings, if
  // any — only used for figma.com links. Falls back to the server's shared
  // Figma token when absent.
  const activeKey = getActiveApiKeyValue();
  if (activeKey) formData.append('access_token', activeKey);

  // Attach the visitor's own AI key, if set — the server uses it instead of
  // its shared GROQ_API_KEY for this request only.
  const aiKey = getAiApiKeyValue();
  if (aiKey) formData.append('ai_api_key', aiKey);

  // Reset composer for the next turn.
  const usedFile = selectedFile;
  selectedFile = null;
  fileInput.value = '';
  filePreview.style.display = 'none';
  urlInput.value = '';
  audienceInput.value = '';
  goalsInput.value = '';
  noteInput.value = '';
  hint.textContent = '';

  setBusy(true);
  addTypingBubble();

  try {
    const res = await fetch('/api/critique', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) {
      replaceTyping(escapeHtml(data.error || 'Something went wrong.'), true);
    } else {
      replaceTyping(renderMarkdown(data.reply || ''), false, data.annotated_image);
    }
  } catch (err) {
    replaceTyping('Could not reach the server. Is server.py still running?', true);
  } finally {
    setBusy(false);
  }
});

updateSendState();
</script>
</body>
</html>
